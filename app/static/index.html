<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Multi Camera Viewer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div><strong>Multi Camera Viewer</strong><small id="version"></small></div>
    </div>
    <div class="toolbar">
      <label class="grid-control">Grid <input id="grid-size" type="range" min="1" max="4" value="2"><output id="grid-output">2 columns</output></label>
      <button id="add-camera" class="primary">Add camera</button>
      <button id="settings-toggle" aria-expanded="false" aria-controls="settings">Settings</button>
    </div>
  </header>

  <main>
    <div id="empty-state" class="empty-state" hidden>
      <div class="empty-icon">＋</div>
      <h1>Add your first camera</h1>
      <p>Connect a USB camera or add an RTSP, HTTP, or MJPEG stream URL.</p>
      <button class="primary" data-add-camera>Add camera</button>
    </div>
    <section id="camera-grid" class="camera-grid" aria-live="polite"></section>
  </main>

  <aside id="settings" class="drawer" aria-hidden="true">
    <div class="drawer-head"><div><h2>Camera settings</h2><p>Choose what appears in the grid.</p></div><button id="settings-close" class="icon-button" aria-label="Close settings">×</button></div>
    <button id="detect-usb" class="wide">Detect USB cameras</button>
    <div id="detected-list" class="detected-list"></div>
    <div id="camera-list" class="camera-list"></div>
    <div class="drawer-footer"><button id="logout" class="danger ghost">Sign out</button></div>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <dialog id="camera-dialog">
    <form id="camera-form" method="dialog">
      <div class="dialog-head"><div><h2 id="dialog-title">Add camera</h2><p>Credentials stay in this computer's private data folder.</p></div><button type="button" id="dialog-close" class="icon-button" aria-label="Close">×</button></div>
      <input id="camera-id" type="hidden">
      <label>Camera name<input id="camera-name" maxlength="80" required placeholder="Front door"></label>
      <label>Camera type<select id="camera-type"><option value="usb">USB webcam</option><option value="rtsp">RTSP network camera</option><option value="http">HTTP / MJPEG stream</option></select></label>
      <label id="source-label">Device or stream URL<input id="camera-source" maxlength="2048" required placeholder="0"></label>
      <p id="source-help" class="help">Windows usually uses an index such as 0. Linux can use /dev/video0.</p>
      <div id="credentials" class="credentials" hidden>
        <label>Username <input id="camera-username" autocomplete="off" placeholder="Optional"></label>
        <label>Password <input id="camera-password" type="password" autocomplete="new-password" placeholder="Optional"></label>
        <label class="check"><input id="clear-credentials" type="checkbox"> Clear previously saved credentials</label>
      </div>
      <label class="check"><input id="camera-enabled" type="checkbox" checked> Camera enabled</label>
      <p id="form-error" class="error" role="alert"></p>
      <div class="dialog-actions"><button type="button" id="dialog-cancel">Cancel</button><button type="submit" class="primary">Save camera</button></div>
    </form>
  </dialog>

  <template id="camera-card-template">
    <article class="camera-card">
      <div class="stream-wrap"><img class="stream" alt=""><div class="stream-overlay"><span class="status-dot"></span><span class="status-text">Connecting</span></div></div>
      <footer>
        <div><h2 class="camera-title"></h2><p class="camera-type"></p></div>
        <div class="card-actions">
          <button class="snapshot" title="Save a picture on this viewing device">Screenshot</button>
          <button class="record" title="Record on this viewing device">Record</button>
          <button class="fullscreen" title="View fullscreen">Fullscreen</button>
        </div>
      </footer>
    </article>
  </template>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
